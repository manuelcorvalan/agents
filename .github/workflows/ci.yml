# =============================================================================
# CI/CD pipeline — GitHub Actions (reference template)
# =============================================================================
# Generic Node.js template for the opencode-agents software factory.
# Adapt the `# ADAPT:` markers to your project (runtime, package manager,
# lint/test commands). The gate jobs (secret-scan + audit) are stack-agnostic.
#
# Required checks (block merge): set them in GitHub →
#   Settings → Branches → Branch protection → "Require status checks"
#   Enable: lint, test, secret-scan, audit, chat-bridge.
# A PR cannot merge until all four checks are green.
# =============================================================================
# Root jobs (lint/test/audit) skip their steps when no root package.json
# exists (steps-level hashFiles guard; job still reports green).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: read-only by default; write only where required.
permissions:
  contents: read
  # ADAPT: only if the job pushes artifacts/tags (e.g. release job).
  # contents: write

# Prevent redundant concurrent runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — block if the formatter/linter is dirty.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ADAPT: replace with your runtime (e.g. actions/setup-python, -go, -java).
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      # ADAPT: replace with your linter (ruff check ., golangci-lint run, ...).
      - name: Run lint
        if: hashFiles('package.json') != ''
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Test — block if any test fails (unit + integration; add e2e if present).
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      # ADAPT: your test runner (pytest, go test ./..., cargo test, ...).
      - name: Run tests
        if: hashFiles('package.json') != ''
        run: npm test

  # ---------------------------------------------------------------------------
  # Secret-scan — gitleaks. Blocks on ANY leaked credential/token/API key.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just HEAD

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only for org/enterprise

  # ---------------------------------------------------------------------------
  # Dependency audit — blocks on high/critical CVEs.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      # ADAPT: fail on high/critical only (npm audit --audit-level=high).
      # Python: pip-audit; Go: govulncheck ./...; Rust: cargo audit.
      - name: Audit dependencies
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Chat bridge — integrations/chat (ADR-0003 D1/D13). Node 24 (Active LTS).
  # Zero runtime deps; devDeps only. Blocks on lint errors, any test failure,
  # coverage < 80% lines/branches, or high/critical CVEs.
  # Secret-scan above already covers integrations/chat/** (full-repo gitleaks).
  # Required check name: "chat-bridge".
  # ---------------------------------------------------------------------------
  chat-bridge:
    name: Chat Bridge (lint, test+coverage, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/chat/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test + coverage (>= 80% lines/branches)
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-bridge-coverage
          path: integrations/chat/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CI gate emit — post a `gate.result` to the chat bridge (ADR-0003 A13.4).
  # Informational only: never blocks the pipeline, NOT a merge check.
  # `always()` runs it even when a gate job fails, so FAIL is emitted as
  # reliably as PASS. Runs on push to main only (no PR spam).
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate (chat bridge emit)
    needs: [lint, test, secret-scan, audit, chat-bridge]
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Emit CI gate.result
        env:
          CHAT_BRIDGE_ENABLED: 'true'
          # config.json is gitignored (D16) and absent on a clean checkout;
          # use the committed example so the emit pipeline runs (dry-run).
          CHAT_BRIDGE_CONFIG: integrations/chat/config/config.example.json
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GATE_OK: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs['secret-scan'].result == 'success' && needs.audit.result == 'success' && needs['chat-bridge'].result == 'success' }}
        run: |
          if [ "$GATE_OK" = "true" ]; then verdict="pass"; raw="PASS"; conclusion="success"; else verdict="fail"; raw="FAIL"; conclusion="failure"; fi
          cat <<EOF | node integrations/chat/bin/chat-emit.mjs || true
          {"platform":"ci","session_id":"ci:${{ github.run_id }}","gate":"ci","verdict":"$verdict","raw_verdict":"$raw","summary":"CI: CI $conclusion","counts":{"high":0,"critical":0}}
          EOF

  # ---------------------------------------------------------------------------
  # Build (optional) — compile/package artifact. Enable if your stack builds.
  # Uncomment and adapt if you need a distributable before release.
  # ---------------------------------------------------------------------------
  # build:
  #   name: Build
  #   runs-on: ubuntu-latest
